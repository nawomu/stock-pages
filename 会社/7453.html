7AtTyiq+cE92jZ4hm2q5665sUZj+w52LtCcouArjobuNbEOldTfkgcvy/CF9EkQO6CamoJIBR5QArs0PP2x434r3Yu6hvFT1rNMuziOC8aG9DAK4akaTcDimuRuTuhOs2HtTtcO12D7X0wUZUYsPP2o8to8RS9GsW7/8TiaGuV1eaboLMabyB7bM4o3Nng8TDYiHNm16olXUIp6dgEnyJQAG1M5fMSb3CKQiSv9Gzl1N5pDY=</script><script>const HUB_SALT="ExKYCqI/F60IyywtWkOG1Q==",HUB_ITER=600000;// 鍵つきページの入口の部品（ブラウザで動く）。合言葉から鍵を作り、ページの中身を開く。鍵はこのブラウザが覚える（1 回入れれば全ページ）。
(function () {
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = u => { let s = ''; for (const x of u) s += String.fromCharCode(x); return btoa(s); };
  async function derive(pw) {
    const m = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);

  }

  const form = document.getElementById('hubform'), msg = document.getElementById('hubmsg');

  })();
