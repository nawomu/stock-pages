eSADHDPWQL/bwa6hcKMq0VNvR5Q3qUiBOF5e2NpCvB9GBBVa8+6uS3po8+M9H+I6YkHDuErA7a3Ho6wyX6d6zZAwHojS/</script><script>const HUB_SALT="ExKYCqI/F60IyywtWkOG1Q==",HUB_ITER=600000;// 鍵つきページの入口の部品（ブラウザで動く）。合言葉から鍵を作り、ページの中身を開く。鍵はこのブラウザが覚える（1 回入れれば全ページ）。
(function () {
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = u => { let s = ''; for (const x of u) s += String.fromCharCode(x); return btoa(s); };
  async function derive(pw) {
    const m = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(HUB_SALT), iterations: HUB_ITER, hash: 'SHA-256' }, m, 256));
  }
  async function open_(raw) {
    const d = b64(document.getElementById('hubdata').textContent.trim());
    const k = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: d.slice(0, 12) }, k, d.slice(12)));
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  const form = document.getElementById('hubform'), msg = document.getElementById('hubmsg');
  form.addEventListener('submit', async ev => {
    ev.preventDefault(); msg.textContent = '確かめています…';
    try {
      const raw = await derive(document.getElementById('hubpw').value.trim()); const html = await open_(raw);
      localStorage.setItem('hubkey', toB64(raw)); show(html);
    } catch (e) { msg.textContent = '合言葉が違います。'; }
  });
  (async () => {
    const st = localStorage.getItem('hubkey');
    if (st) { try { show(await open_(b64(st))); return; } catch (e) { localStorage.removeItem('hubkey'); } }
    form.style.display = 'block'; document.getElementById('hubpw').focus();
  })();
})();
