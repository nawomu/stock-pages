YwQ6iA8rSH2+Rp2Qy1mHkdiIriVp7FXzeMsiHsJNylVK6X5M9BNaM56MZLhQUonDMkKUAIocTebstedSoSy2F3Uzr27xjZhEx2e6GNcqWOnJzU/kMVtk7UlNr6etzzKatRZTR2wJtaa+aiVAafPnTfvUnyYCYMoXDb1bskE/qKLkS1scBJUzUwgCEgQ9EanmuzuBS5biWZYL59LZdLaEVVjpr+dq/ikUY4E0UxGdmpKez8Nhx7kvRC4gZxPWrtFQpzaxwtnBh+EmGqLOxGFBsntg=</script><script>const HUB_SALT="ExKYCqI/F60IyywtWkOG1Q==",HUB_ITER=600000;// 鍵つきページの入口の部品（ブラウザで動く）。合言葉から鍵を作り、ページの中身を開く。鍵はこのブラウザが覚える（1 回入れれば全ページ）。
(function () {
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = u => { let s = ''; for (const x of u) s += String.fromCharCode(x); return btoa(s); };
  async function derive(pw) {
    const m = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);

  }

  const form = document.getElementById('hubform'), msg = document.getElementById('hubmsg');
