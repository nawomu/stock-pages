HB/zEN4RhgSoCK/nAfd1WKsgxAjGXEnG1ekhfUHQLPhO2XV7Z4VmH7pmrFYPpi4QfHm/kMyI9/5CNVYK1miR+P7ltHHRrm0wcl0wwGPYXyspBCM+Al8RuDU/oW8lo6MW0sXVr6z3tPB0uybZdT+bJj+2Dv9aejS9mkV4TOg9kK8E0eEfU9IncJ3srjyhz6b+tw5kq7RlMAvAWikB4bnc8q5s7XIhbkvZKhBmg5ePjSboH5evQRT5gpWVKQWs=</script><script>const HUB_SALT="ExKYCqI/F60IyywtWkOG1Q==",HUB_ITER=600000;// 鍵つきページの入口の部品（ブラウザで動く）。合言葉から鍵を作り、ページの中身を開く。鍵はこのブラウザが覚える（1 回入れれば全ページ）。
(function () {
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = u => { let s = ''; for (const x of u) s += String.fromCharCode(x); return btoa(s); };
  async function derive(pw) {
    const m = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);

  }

  const form = document.getElementById('hubform'), msg = document.getElementById('hubmsg');
